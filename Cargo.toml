[workspace]
members = [
    "crates/*",
]
resolver = "2"
[workspace.package]
version = "0.0.1"
authors = [
    "WasmBridge Team",
]
license = "MIT"
edition = "2024"
repository = "https://github.com/wasmbridge/bridge-protocol"
[profile.dev]
opt-level = 0
debug = true
[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
[profile.dist]
inherits = "release"
lto = "thin"
[workspace.dependencies]
tonic = { version = "0.12.3", features = [
    "tls",
    "transport",
    "channel",
    "tls-native-roots",
] }
tonic-web = "0.12"
prost = "0.13.1"
tokio = { version = "1.52.1" }
tokio-stream = "0.1.18"
serde = { version = "1.0", features = [
    "derive",
] }
serde_json = "1.0"
rustls = { version = "0.23", features = [
    "ring",
] }
chrono = "0.4"
async-trait = "0.1"
tonic-build = "0.12.3"
protoc-bin-vendored = "3.0"
